name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; skip runs queued behind a newer one.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      # Guard against the failure mode this site used to have: a client-rendered
      # page that served an empty shell to crawlers. If the built HTML does not
      # contain the tagline, the build is not shipping content.
      - name: Verify the build is server-rendered
        run: |
          grep -q "Senior Software Engineer at" dist/index.html \
            || { echo "::error::dist/index.html has no rendered prose"; exit 1; }
          test -f dist/CNAME || { echo "::error::CNAME missing — custom domain would break"; exit 1; }
          test -f dist/llms.txt || { echo "::error::llms.txt missing"; exit 1; }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
